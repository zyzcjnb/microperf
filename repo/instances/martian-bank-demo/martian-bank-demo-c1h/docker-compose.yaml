version: "3.9"

services:
  mongo:
      image: mongo
      restart: always
      environment:
        MONGO_INITDB_ROOT_USERNAME: root
        MONGO_INITDB_ROOT_PASSWORD: example
      networks:
      - bankapp-network

  ui:
    build:
      context: ./ui
    container_name: ui
    hostname: ui
    image: martian-bank-ui
    ports:
      - "3000:3000"
    restart: always
    env_file:
      - ./ui/.env
    networks:
      - bankapp-network

  nginx:
    build: 
      context: ./nginx
    container_name: nginx
    hostname: nginx
    image: martian-bank-nginx
    ports:
      - "8080:8080"
    depends_on:
      - customer-auth
      - atm-locator
      - ui
    restart: always
    networks:
      - bankapp-network

  customer-auth:
    build:
      context: ./customer-auth
    container_name: customer-auth
    hostname: customer-auth
    image: martian-bank-customer-auth
    ports:
      - "8000:8000"
    env_file:
      - ./customer-auth/.env
    restart: always
    networks:
      - bankapp-network

  atm-locator:
    build:
      context: ./atm-locator
    container_name: atm-locator
    hostname: martian-bank-atm-locator
    image: martian-bank-atm-locator
    ports:
      - "8001:8001"
    env_file:
      - ./atm-locator/.env
    restart: always
    networks:
      - bankapp-network
  
  dashboard:
    container_name: dashboard
    hostname: dashboard
    ports:
      - "5000:5000"
    restart: always
    image: martian-bank-dashboard
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      ACCOUNT_HOST: accounts
      TRANSACTION_HOST: transactions
      LOAN_HOST: loan
    networks:
      - bankapp-network
    
  accounts:
    build:
      context: .
      dockerfile: accounts/Dockerfile
    container_name: accounts
    hostname: accounts
    image: martian-bank-accounts
    restart: always
    networks:
      - bankapp-network

  loan:
    build:
      context: .
      dockerfile: loan/Dockerfile
    container_name: loan
    hostname: loan
    image: martian-bank-loan
    environment:
      ACCOUNT_HOST: accounts
    restart: always
    networks:
      - bankapp-network

  transactions:
    build:
      context: .
      dockerfile: transactions/Dockerfile
    container_name: transactions
    hostname: martian-bank-transactions
    image: martian-bank-transactions
    restart: always
    environment:
      ACCOUNT_HOST: accounts
      TRANSACTION_SENDER_RESOLVER_HOST: transaction-sender-resolver
      TRANSACTION_RECEIVER_RESOLVER_HOST: transaction-receiver-resolver
      TRANSACTION_EXECUTOR_HOST: transaction-executor
    depends_on:
      - transaction-sender-resolver
      - transaction-receiver-resolver
      - transaction-executor
    networks:
      - bankapp-network 

  transaction-sender-resolver:
    build:
      context: .
      dockerfile: transaction-sender-resolver/Dockerfile
    container_name: transaction-sender-resolver
    hostname: transaction-sender-resolver
    image: martian-bank-transaction-sender-resolver
    restart: always
    env_file:
      - ./transaction-sender-resolver/.env
    environment:
      ACCOUNT_HOST: accounts
      RECEIVER_RESOLVER_HOST: transaction-receiver-resolver
    networks:
      - bankapp-network

  transaction-receiver-resolver:
    build:
      context: .
      dockerfile: transaction-receiver-resolver/Dockerfile
    container_name: transaction-receiver-resolver
    hostname: transaction-receiver-resolver
    image: martian-bank-transaction-receiver-resolver
    restart: always
    env_file:
      - ./transaction-receiver-resolver/.env
    environment:
      ACCOUNT_HOST: accounts
      EXECUTOR_HOST: transaction-executor
    networks:
      - bankapp-network

  transaction-executor:
    build:
      context: .
      dockerfile: transaction-executor/Dockerfile
    container_name: transaction-executor
    hostname: transaction-executor
    image: martian-bank-transaction-executor
    restart: always
    env_file:
      - ./transaction-executor/.env
    environment:
      ACCOUNT_HOST: accounts
    networks:
      - bankapp-network

  locust:
    build:
      context: ./performance_locust
    container_name: locust
    hostname: locust
    ports:
      - "8089:8089"
    image: martian-bank-locust
    restart: always
    networks:
      - bankapp-network

networks:
  bankapp-network:
    driver: bridge
